# Server
server.port=${PORT:8080}

# Jira
jira.base-url=${JIRA_BASE_URL}
jira.email=${JIRA_EMAIL}
jira.api-token=${JIRA_API_TOKEN}

# Anthropic
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.max-tokens=4000

# OpenAI embeddings
openai.api-key=${OPENAI_API_KEY}
openai.embedding-model=text-embedding-3-small

# RAG settings
rag.chunk-size=${RAG_CHUNK_SIZE:3000}
rag.chunk-overlap=${RAG_CHUNK_OVERLAP:300}
rag.top-k=${RAG_TOP_K:6}

# Security
app.secret-token=${APP_SECRET_TOKEN:changeme}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
