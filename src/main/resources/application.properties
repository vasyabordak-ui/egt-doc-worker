# Server
server.port=${PORT:8080}

# Jira
jira.base-url=${JIRA_BASE_URL}
jira.email=${JIRA_EMAIL}
jira.api-token=${JIRA_API_TOKEN}

# Anthropic
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=claude-sonnet-4-20250514
anthropic.max-tokens=2000

# Security — simple token to protect your /answer-ticket endpoint
app.secret-token=${APP_SECRET_TOKEN:changeme}

# Anthropic Files API — JSON map of filename -> file_id
anthropic.file-ids-json=${ANTHROPIC_FILE_IDS}